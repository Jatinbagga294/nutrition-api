services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: nutrition
      POSTGRES_DB: nutrition
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://nutrition:nutrition@db:5432/nutrition
      JWT_SECRET: dev-secret-not-for-production
    depends_on:
      # Waits for Postgres to accept connections, not just to start, so the API
      # does not crash-loop on first boot.
      db:
        condition: service_healthy

volumes:
  pgdata:
